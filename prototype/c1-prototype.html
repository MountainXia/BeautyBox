<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F7F5F2" />
  <title>妆匣 BeautyBox · TASK02.1-C1 交互原型</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <style>
    /* C1 原型 iOS Safari 触控防卡死保护（不修改正式样式文件） */
    html.has-modal-open .app-main {
      touch-action: pan-y;
    }
    .sheet-backdrop,
    .dialog-backdrop {
      touch-action: manipulation;
    }
    .app-main,
    .sheet-body,
    .dialog-panel,
    button,
    a,
    input,
    select,
    textarea {
      touch-action: manipulation;
    }
    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }
    /* C1 快速改状态三态区分：当前选中 / 可点击切换 / 不可选弱化（点击弹窗提示原因） */
    .c1-status-bar {
      gap: 4px;
      padding: 4px;
    }
    .c1-status-bar .seg-btn {
      color: var(--text-primary);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid transparent;
    }
    .c1-status-bar .seg-btn.is-active {
      background: var(--bg-card);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(157, 104, 101, 0.18);
    }
    .c1-status-bar .seg-btn.is-unavailable {
      opacity: 0.35;
      background: transparent;
      color: var(--text-tertiary);
      font-weight: 400;
      border: 1px dashed rgba(35, 31, 29, 0.16);
      box-shadow: none;
    }
    /* 防止标签、分段按钮、标题括号与单位在窄屏下换行断裂 */
    .pill,
    .chip,
    .ghost-mini-btn,
    .btn-sm,
    .seg-btn {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .c1-subseg {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .c1-subseg::-webkit-scrollbar {
      display: none;
    }
    .c1-subseg .seg-btn {
      flex: 1 0 auto;
      padding: 0 10px;
      font-size: 12px;
      min-height: 34px;
    }
    .segmented {
      overflow-x: auto;
      scrollbar-width: none;
    }
    .segmented::-webkit-scrollbar {
      display: none;
    }
    .segmented .seg-btn {
      padding: 0 10px;
    }
    .section-header {
      flex-wrap: wrap;
      gap: 4px 10px;
      align-items: baseline;
    }
    .section-title {
      white-space: nowrap;
    }
    .section-hint {
      white-space: normal;
    }
  </style>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="desktop-toolbar" class="desktop-toolbar">
      <div class="desktop-toolbar-left">
        <span class="badge-dot"></span>
        <span>BeautyBox 妆匣 · TASK02.1-C1 产品体验交互原型（模拟数据 · 与正式代码完全隔离）</span>
      </div>
      <div class="desktop-toolbar-actions">
        <a href="./index.html" class="ghost-mini-btn" style="text-decoration:none;">返回原原型</a>
      </div>
    </div>

    <div id="device-frame" class="device-frame">
      <header id="app-header" class="app-header"></header>
      <main id="app-main" class="app-main" tabindex="-1"></main>

      <div id="sheet-root" class="overlay-root" aria-hidden="true"></div>
      <div id="dialog-root" class="overlay-root" aria-hidden="true"></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>
    </div>
  </div>

  <script type="module" src="./js/c1-prototype.js"></script>
</body>
</html>
